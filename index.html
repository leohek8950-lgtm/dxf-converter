<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI CAD Converter - 3D Visualizer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 420px; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        h2 { margin-top: 0; color: #333; font-size: 20px; }
        label { font-size: 14px; font-weight: bold; color: #555; }
        select, input[type="file"], button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #218838; }
        .result-box { background: #e9ecef; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 250px; overflow-y: auto; flex-grow: 1; }
        #canvas-container { flex-grow: 1; background: #111; position: relative; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="sidebar">
        <h2>Конвертер чертежей в ЧПУ</h2>
        <div>
            <label>Режим 3D-визуализации:</label>
            <select id="processType">
                <option value="extrude" selected>Плоская деталь -> 3D Выдавливание (Extrude)</option>
                <option value="lathe">Токарная деталь -> 3D Вращение (Revolve)</option>
                <option value="wireframe">Чертеж -> 2D Векторная сетка</option>
            </select>
        </div>
        <div>
            <label>Загрузить файл (DXF, PNG, JPG):</label>
            <input type="file" id="dxfFile" accept=".dxf,.png,.jpg,.jpeg">
        </div>
        <button onclick="uploadAndProcess()">Сгенерировать 3D</button>
        <div>
            <label>Статус / Данные геометрии:</label>
            <div id="resultOutput" class="result-box">Загрузите файл...</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls, gridHelper;
        let currentSegments = [];

        function initThree() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = ''; 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 100000);
            camera.position.set(0, 100, 250);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(200, 300, 200);
            scene.add(dirLight1);

            const dirLight2 = new THREE.DirectionalLight(0x99ccff, 0.4);
            dirLight2.position.set(-200, -100, -200);
            scene.add(dirLight2);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            gridHelper = new THREE.GridHelper(1000, 40, 0x444444, 0x222222);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
            document.getElementById('processType').addEventListener('change', () => renderGeometry(currentSegments));
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        async function uploadAndProcess() {
            const fileInput = document.getElementById('dxfFile');
            const outputBox = document.getElementById('resultOutput');

            if (fileInput.files.length === 0) {
                alert('Выберите файл!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            outputBox.textContent = 'Обработка файла и генерация 3D...';

            try {
                const response = await fetch('/process-dxf', { method: 'POST', body: formData });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || 'Ошибка сервера');

                outputBox.textContent = JSON.stringify(data, null, 2);
                currentSegments = data.segments;
                renderGeometry(currentSegments);

            } catch (err) {
                outputBox.textContent = 'Ошибка: ' + err.message;
            }
        }

        function renderGeometry(segments) {
            const oldGroup = scene.getObjectByName('dxfGroup');
            if (oldGroup) scene.remove(oldGroup);

            if (!segments || segments.length === 0) return;

            const mode = document.getElementById('processType').value;
            const group = new THREE.Group();
            group.name = 'dxfGroup';

            const metalMaterial = new THREE.MeshStandardMaterial({
                color: 0x8899a6,
                metalness: 0.8,
                roughness: 0.25,
                side: THREE.DoubleSide
            });

            if (mode === 'extrude') {
                // Преобразуем отрезки контура в 3D объем (Extrude)
                const shape = new THREE.Shape();
                if (segments.length > 0) {
                    shape.moveTo(segments[0].x1, segments[0].y1);
                    segments.forEach(s => shape.lineTo(s.x2, s.y2));
                }

                const extrudeSettings = {
                    depth: 5, // Толщина детали 5мм
                    bevelEnabled: true,
                    bevelSegments: 2,
                    steps: 1,
                    bevelSize: 0.5,
                    bevelThickness: 0.5
                };

                const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                const mesh = new THREE.Mesh(geometry, metalMaterial);
                mesh.rotation.x = -Math.PI / 2;
                group.add(mesh);

            } else if (mode === 'lathe') {
                // Режим вращения профиля
                let profilePoints = [];
                segments.forEach(s => {
                    if (s.y1 >= 0 && s.y2 >= 0) {
                        profilePoints.push(new THREE.Vector2(s.y1, s.x1));
                        profilePoints.push(new THREE.Vector2(s.y2, s.x2));
                    }
                });

                if (profilePoints.length > 1) {
                    const latheGeo = new THREE.LatheGeometry(profilePoints, 64);
                    const latheMesh = new THREE.Mesh(latheGeo, metalMaterial);
                    latheMesh.rotation.z = -Math.PI / 2;
                    group.add(latheMesh);
                }
            } else {
                // Каркасная 2D сетка
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88 });
                const linePositions = [];
                segments.forEach(s => linePositions.push(s.x1, s.y1, 0, s.x2, s.y2, 0));

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
                const lines = new THREE.LineSegments(geometry, lineMaterial);
                lines.rotation.x = -Math.PI / 2;
                group.add(lines);
            }

            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            group.position.sub(center);
            scene.add(group);

            const maxDim = Math.max(size.x, size.y, size.z);
            const camDistance = Math.max(maxDim * 2.5, 100);
            camera.position.set(0, camDistance * 0.7, camDistance);
            camera.lookAt(0, 0, 0);
        }

        window.onload = initThree;
    </script>
</body>
</html>
