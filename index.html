<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI CAD Converter - 3D Visualizer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 420px; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        h2 { margin-top: 0; color: #333; font-size: 20px; }
        label { font-size: 14px; font-weight: bold; color: #555; }
        select, input[type="file"], button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #218838; }
        .result-box { background: #e9ecef; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 250px; overflow-y: auto; flex-grow: 1; }
        #canvas-container { flex-grow: 1; background: #111; position: relative; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="sidebar">
        <h2>Конвертер чертежей в ЧПУ</h2>
        <div>
            <label>Тип детали и обработки:</label>
            <select id="processType">
                <option value="flat">Плоская резка -> 2D Контур</option>
                <option value="lathe">Токарная обработка -> 3D Revolve</option>
            </select>
        </div>
        <div>
            <label>Загрузить чертеж или картинку (DXF, PNG, JPG):</label>
            <input type="file" id="dxfFile" accept=".dxf,.png,.jpg,.jpeg">
        </div>
        <button onclick="uploadAndProcess()">Визуализировать</button>
        <div>
            <label>Статус / Результат:</label>
            <div id="resultOutput" class="result-box">Загрузите файл для визуализации...</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls, gridHelper;
        let currentSegments = [];

        function initThree() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = ''; 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 100000);
            camera.position.set(0, 50, 150);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(100, 200, 100);
            scene.add(dirLight);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            gridHelper = new THREE.GridHelper(500, 20, 0x444444, 0x222222);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
            document.getElementById('processType').addEventListener('change', () => renderGeometry(currentSegments));
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        async function uploadAndProcess() {
            const fileInput = document.getElementById('dxfFile');
            const outputBox = document.getElementById('resultOutput');

            if (fileInput.files.length === 0) {
                alert('Выберите файл (DXF, PNG или JPG)!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            outputBox.textContent = 'Обработка файла...';

            try {
                const response = await fetch('/process-dxf', { method: 'POST', body: formData });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || 'Ошибка сервера');

                outputBox.textContent = JSON.stringify(data, null, 2);
                currentSegments = data.segments;
                renderGeometry(currentSegments);

            } catch (err) {
                outputBox.textContent = 'Ошибка: ' + err.message;
            }
        }

        function renderGeometry(segments) {
            const oldGroup = scene.getObjectByName('dxfGroup');
            if (oldGroup) scene.remove(oldGroup);

            if (!segments || segments.length === 0) return;

            const mode = document.getElementById('processType').value;
            const group = new THREE.Group();
            group.name = 'dxfGroup';

            if (mode === 'lathe') {
                let profilePoints = [];
                segments.forEach(s => {
                    if (s.y1 >= -0.01 && s.y2 >= -0.01) {
                        profilePoints.push({ x: s.x1, y: s.y1 });
                        profilePoints.push({ x: s.x2, y: s.y2 });
                    }
                });

                profilePoints.sort((a, b) => a.x - b.x);

                const cleanPoints = [];
                profilePoints.forEach(p => {
                    if (cleanPoints.length === 0 || Math.hypot(p.x - cleanPoints[cleanPoints.length - 1].x, p.y - cleanPoints[cleanPoints.length - 1].y) > 0.01) {
                        cleanPoints.push(new THREE.Vector2(Math.max(0.001, p.y), p.x));
                    }
                });

                if (cleanPoints.length > 1) {
                    const latheGeo = new THREE.LatheGeometry(cleanPoints, 64);
                    const latheMat = new THREE.MeshStandardMaterial({ color: 0xc0c0c0, metalness: 0.85, roughness: 0.2, side: THREE.DoubleSide });
                    const latheMesh = new THREE.Mesh(latheGeo, latheMat);
                    latheMesh.rotation.z = -Math.PI / 2;
                    group.add(latheMesh);
                }
            } else {
                const lineMaterial = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 2 });
                const linePositions = [];

                segments.forEach(seg => {
                    linePositions.push(seg.x1, seg.y1, 0);
                    linePositions.push(seg.x2, seg.y2, 0);
                });

                const geometry = new THREE.BufferGeometry();
                geometry.setAttribute('position', new THREE.Float32BufferAttribute(linePositions, 3));
                const lines = new THREE.LineSegments(geometry, lineMaterial);
                group.add(lines);
            }

            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            group.position.sub(center);
            scene.add(group);

            const maxDim = Math.max(size.x, size.y, size.z);
            const camDistance = Math.max(maxDim * 2, 50);
            camera.position.set(0, camDistance * 0.5, camDistance);
            camera.lookAt(0, 0, 0);
        }

        window.onload = initThree;
    </script>
</body>
</html>
