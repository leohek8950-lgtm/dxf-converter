<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI CAD Converter - 3D Visualizer</title>
    <style>
        body { margin: 0; font-family: Arial, sans-serif; background-color: #f4f6f9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 420px; background: #ffffff; box-shadow: 2px 0 10px rgba(0,0,0,0.1); padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; z-index: 10; }
        h2 { margin-top: 0; color: #333; font-size: 20px; }
        label { font-size: 14px; font-weight: bold; color: #555; }
        select, input[type="file"], button { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 14px; }
        button { background-color: #28a745; color: white; border: none; cursor: pointer; font-weight: bold; transition: background 0.2s; }
        button:hover { background-color: #218838; }
        .result-box { background: #e9ecef; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 12px; white-space: pre-wrap; max-height: 250px; overflow-y: auto; flex-grow: 1; }
        #canvas-container { flex-grow: 1; background: #111; position: relative; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="sidebar">
        <h2>Конвертер чертежей в ЧПУ</h2>
        <div>
            <label>Тип 3D-моделирования:</label>
            <select id="processType">
                <option value="extrude" selected>Плоская деталь -> 3D Extrude</option>
                <option value="lathe">Токарная деталь -> 3D Revolve</option>
                <option value="wireframe">Векторный каркас</option>
            </select>
        </div>
        <div>
            <label>Загрузить чертеж (DXF, PNG, JPG):</label>
            <input type="file" id="dxfFile" accept=".dxf,.png,.jpg,.jpeg">
        </div>
        <button onclick="uploadAndProcess()">Сгенерировать 3D</button>
        <div>
            <label>Статус обработки:</label>
            <div id="resultOutput" class="result-box">Загрузите чертеж...</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls, gridHelper;
        let currentContours = [];

        function initThree() {
            const container = document.getElementById('canvas-container');
            container.innerHTML = ''; 

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x1a1a1a);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 1, 100000);
            camera.position.set(0, 150, 300);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambientLight);

            const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight1.position.set(200, 300, 200);
            scene.add(dirLight1);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            gridHelper = new THREE.GridHelper(1000, 40, 0x444444, 0x222222);
            scene.add(gridHelper);

            window.addEventListener('resize', onWindowResize);
            document.getElementById('processType').addEventListener('change', () => renderGeometry(currentContours));
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        async function uploadAndProcess() {
            const fileInput = document.getElementById('dxfFile');
            const outputBox = document.getElementById('resultOutput');

            if (fileInput.files.length === 0) {
                alert('Выберите файл!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            outputBox.textContent = 'Анализ контуров и построение 3D...';

            try {
                const response = await fetch('/process-dxf', { method: 'POST', body: formData });
                const data = await response.json();

                if (!response.ok) throw new Error(data.detail || 'Ошибка сервера');

                outputBox.textContent = JSON.stringify(data, null, 2);
                currentContours = data.contours;
                renderGeometry(currentContours);

            } catch (err) {
                outputBox.textContent = 'Ошибка: ' + err.message;
            }
        }

        function renderGeometry(contours) {
            const oldGroup = scene.getObjectByName('dxfGroup');
            if (oldGroup) scene.remove(oldGroup);

            if (!contours || contours.length === 0) return;

            const mode = document.getElementById('processType').value;
            const group = new THREE.Group();
            group.name = 'dxfGroup';

            const metalMat = new THREE.MeshStandardMaterial({
                color: 0x90a4ae,
                metalness: 0.8,
                roughness: 0.2,
                side: THREE.DoubleSide
            });

            if (mode === 'extrude') {
                contours.forEach(pts => {
                    if (pts.length < 3) return;
                    const shape = new THREE.Shape();
                    shape.moveTo(pts[0].x, pts[0].y);
                    for (let i = 1; i < pts.length; i++) {
                        shape.lineTo(pts[i].x, pts[i].y);
                    }
                    shape.closePath();

                    const extrudeSettings = { depth: 10, bevelEnabled: true, bevelThickness: 1, bevelSize: 1 };
                    const geo = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                    const mesh = new THREE.Mesh(geo, metalMat);
                    mesh.rotation.x = -Math.PI / 2;
                    group.add(mesh);
                });

            } else if (mode === 'lathe') {
                // Выбираем самый длинный контур для токарного вращения
                let bestContour = contours[0];
                contours.forEach(c => { if (c.length > bestContour.length) bestContour = c; });

                const profilePoints = [];
                bestContour.forEach(p => {
                    if (p.y >= 0) profilePoints.push(new THREE.Vector2(p.y, p.x));
                });

                if (profilePoints.length > 1) {
                    const latheGeo = new THREE.LatheGeometry(profilePoints, 64);
                    const latheMesh = new THREE.Mesh(latheGeo, metalMat);
                    latheMesh.rotation.z = -Math.PI / 2;
                    group.add(latheMesh);
                }
            } else {
                const lineMat = new THREE.LineBasicMaterial({ color: 0x00ff88 });
                contours.forEach(pts => {
                    const pos = [];
                    for (let i = 0; i < pts.length; i++) {
                        const next = pts[(i + 1) % pts.length];
                        pos.push(pts[i].x, pts[i].y, 0, next.x, next.y, 0);
                    }
                    const geo = new THREE.BufferGeometry();
                    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
                    const lines = new THREE.LineSegments(geo, lineMat);
                    lines.rotation.x = -Math.PI / 2;
                    group.add(lines);
                });
            }

            const box = new THREE.Box3().setFromObject(group);
            const center = box.getCenter(new THREE.Vector3());
            const size = box.getSize(new THREE.Vector3());

            group.position.sub(center);
            scene.add(group);

            const maxDim = Math.max(size.x, size.y, size.z);
            const camDistance = Math.max(maxDim * 2.5, 100);
            camera.position.set(0, camDistance * 0.7, camDistance);
            camera.lookAt(0, 0, 0);
        }

        window.onload = initThree;
    </script>
</body>
</html>
