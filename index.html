<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>AI CAD Converter - 3D Visualizer</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        .sidebar {
            width: 420px;
            background: #ffffff;
            box-shadow: 2px 0 10px rgba(0,0,0,0.1);
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
            z-index: 10;
        }
        h2 { margin-top: 0; color: #333; font-size: 20px; }
        label { font-size: 14px; font-weight: bold; color: #555; }
        select, input[type="file"], button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        button {
            background-color: #28a745;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background-color: #218838; }
        .result-box {
            background: #e9ecef;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre-wrap;
            max-height: 250px;
            overflow-y: auto;
            flex-grow: 1;
        }
        #canvas-container {
            flex-grow: 1;
            background: #000;
            position: relative;
        }
    </style>
    <!-- Подключаем Three.js через CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div class="sidebar">
        <h2>Конвертер чертежей в ЧПУ</h2>
        
        <div>
            <label>Тип детали и обработки:</label>
            <select id="processType">
                <option>Плоская (Лазерная / Плазменная резка) -&gt; DXF</option>
            </select>
        </div>

        <div>
            <label>Загрузить чертеж (DXF):</label>
            <input type="file" id="dxfFile" accept=".dxf">
        </div>

        <button onclick="uploadAndProcess()">Очистить и визуализировать DXF</button>

        <div>
            <label>Статус / Результат:</label>
            <div id="resultOutput" class="result-box">Ожидание загрузки файла...</div>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        let scene, camera, renderer, controls;

        function initThree() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x111111);

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 10000);
            camera.position.set(0, 0, 500);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            container.appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            const grid = new THREE.GridHelper(1000, 50, 0x444444, 0x222222);
            grid.rotation.x = Math.PI / 2;
            scene.add(grid);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function onWindowResize() {
            const container = document.getElementById('canvas-container');
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        async function uploadAndProcess() {
            const fileInput = document.getElementById('dxfFile');
            const outputBox = document.getElementById('resultOutput');

            if (fileInput.files.length === 0) {
                alert('Пожалуйста, выберите .dxf файл!');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            outputBox.textContent = 'Обработка и анализ файла на сервере...';

            try {
                const response = await fetch('/process-dxf', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.detail || 'Ошибка сервера');
                }

                outputBox.textContent = JSON.stringify(data, null, 2);
                renderGeometry(data.segments);

            } catch (err) {
                outputBox.textContent = 'Ошибка: ' + err.message;
            }
        }

        function renderGeometry(segments) {
            // Удаляем старые нарисованные объекты детали
            const oldGroup = scene.getObjectByName('dxfGroup');
            if (oldGroup) scene.remove(oldGroup);

            const group = new THREE.Group();
            group.name = 'dxfGroup';

            const material = new THREE.LineBasicMaterial({ color: 0x00ff88, linewidth: 2 });

            if (segments && segments.length > 0) {
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;

                segments.forEach(seg => {
                    if (seg.type === 'line') {
                        const points = [
                            new THREE.Vector3(seg.x1, seg.y1, 0),
                            new THREE.Vector3(seg.x2, seg.y2, 0)
                        ];
                        const geometry = new THREE.BufferGeometry().setFromPoints(points);
                        const line = new THREE.Line(geometry, material);
                        group.add(line);

                        minX = Math.min(minX, seg.x1, seg.x2);
                        maxX = Math.max(maxX, seg.x1, seg.x2);
                        minY = Math.min(minY, seg.y1, seg.y2);
                        maxY = Math.max(maxY, seg.y1, seg.y2);
                    } else if (seg.type === 'circle') {
                        const circleGeo = new THREE.CircleGeometry(seg.r, 32);
                        const wireframe = new THREE.WireframeGeometry(circleGeo);
                        const circleLine = new THREE.LineSegments(wireframe, material);
                        circleLine.position.set(seg.cx, seg.cy, 0);
                        group.add(circleLine);

                        minX = Math.min(minX, seg.cx - seg.r);
                        maxX = Math.max(maxX, seg.cx + seg.r);
                        minY = Math.min(minY, seg.cy - seg.r);
                        maxY = Math.max(maxY, seg.cy + seg.r);
                    }
                });

                // Центрируем камеру по габаритам детали
                const centerX = (minX + maxX) / 2;
                const centerY = (minY + maxY) / 2;
                group.position.set(-centerX, -centerY, 0);
                controls.target.set(0, 0, 0);

                const maxDim = Math.max(maxX - minX, maxY - minY);
                camera.position.set(0, 0, maxDim > 0 ? maxDim * 1.5 : 500);
                camera.lookAt(0, 0, 0);
            }

            scene.add(group);
        }

        window.onload = initThree;
    </script>
</body>
</html>
