<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision AI CAD Engine — Генератор 3D STEP моделей по чертежам</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Three.js + STLLoader + OrbitControls -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    :root {
      --bg: #090d16;
      --panel: #131927;
      --panel-border: #212b42;
      --accent: #00f2fe;
      --accent-gradient: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --success: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Сайдбар управления */
    .sidebar {
      width: 440px;
      background: var(--panel);
      border-right: 1px solid var(--panel-border);
      padding: 28px;
      display: flex;
      flex-direction: column;
      gap: 24px;
      z-index: 10;
      box-shadow: 10px 0 30px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .brand span {
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Зона загрузки */
    .dropzone {
      border: 2px dashed var(--panel-border);
      border-radius: 14px;
      padding: 36px 20px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.01);
    }

    .dropzone:hover {
      border-color: var(--accent);
      background: rgba(0, 242, 254, 0.03);
    }

    .dropzone input { display: none; }

    .dropzone-icon {
      font-size: 32px;
      margin-bottom: 12px;
    }

    .dropzone-text {
      font-size: 14px;
      color: var(--text-muted);
      line-height: 1.5;
    }

    .dropzone-text strong {
      color: var(--text-main);
    }

    /* Кнопки */
    .btn {
      background: var(--accent-gradient);
      border: none;
      color: #040914;
      font-weight: 700;
      font-size: 15px;
      padding: 16px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }

    .btn:hover:not(:disabled) {
      opacity: 0.95;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 242, 254, 0.25);
    }

    .btn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }

    .btn-download {
      background: var(--success);
      color: #ffffff;
      text-decoration: none;
      font-weight: 700;
      font-size: 15px;
      padding: 16px;
      border-radius: 10px;
      text-align: center;
      display: none;
      transition: all 0.2s ease;
    }

    .btn-download:hover {
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.3);
      transform: translateY(-2px);
    }

    /* Спецификация JSON */
    .spec-container {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .spec-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .spec-viewer {
      background: #060911;
      border: 1px solid var(--panel-border);
      border-radius: 10px;
      padding: 16px;
      font-family: 'Courier New', Courier, monospace;
      font-size: 13px;
      color: #38bdf8;
      overflow-y: auto;
      flex-grow: 1;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    /* Окно 3D Просмотра */
    .viewport {
      flex-grow: 1;
      position: relative;
      background: radial-gradient(circle at center, #151d30 0%, #090d16 100%);
    }

    #canvas-container {
      width: 100%;
      height: 100%;
    }

    .status-badge {
      position: absolute;
      top: 24px;
      left: 24px;
      background: rgba(19, 25, 39, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid var(--panel-border);
      padding: 12px 22px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="brand">
      ⚙️ Precision <span>AI CAD</span>
    </div>

    <div class="dropzone" onclick="document.getElementById('file-input').click()">
      <div class="dropzone-icon">📐</div>
      <div class="dropzone-text" id="dropzone-label">
        Перетащите чертеж сюда или <strong>выберите файл</strong><br>(PNG, JPG, JPEG)
      </div>
      <input type="file" id="file-input" accept="image/*" onchange="onFileSelected(this.files[0])">
    </div>

    <button id="process-btn" class="btn" disabled onclick="processDrawing()">
      <span>⚡ Сгенерировать STEP модель</span>
    </button>

    <a id="download-btn" class="btn-download" href="#" download>
      📥 Скачать файл .STEP
    </a>

    <div class="spec-container">
      <div class="spec-title">Распознанная геометрия (JSON):</div>
      <div class="spec-viewer" id="spec-output">// Здесь появится геометрическая спецификация детали после анализа чертежа...</div>
    </div>
  </div>

  <div class="viewport">
    <div class="status-badge" id="status-badge">Готов к обработке чертежа</div>
    <div id="canvas-container"></div>
  </div>

  <script>
    let currentFile = null;
    let scene, camera, renderer, controls, activeMesh;

    function init3D() {
      const container = document.getElementById('canvas-container');
      
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 2000);
      camera.position.set(120, 100, 160);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;

      // Источники света
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(100, 150, 100);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x00f2fe, 0.4);
      dirLight2.position.set(-100, -50, -100);
      scene.add(dirLight2);

      // Сетка под детали
      const grid = new THREE.GridHelper(400, 40, 0x212b42, 0x131927);
      grid.position.y = -30;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function onFileSelected(file) {
      if (!file) return;
      currentFile = file;
      document.getElementById('dropzone-label').innerHTML = `Выбран файл:<br><strong>${file.name}</strong>`;
      document.getElementById('process-btn').disabled = false;
    }

    async function processDrawing() {
      if (!currentFile) return;

      const badge = document.getElementById('status-badge');
      const specViewer = document.getElementById('spec-output');
      const downloadBtn = document.getElementById('download-btn');
      const processBtn = document.getElementById('process-btn');

      badge.innerText = "⏳ ИИ читает размеры и генерирует STEP модель...";
      processBtn.disabled = true;
      downloadBtn.style.display = "none";

      const formData = new FormData();
      formData.append("file", currentFile);

      try {
        const response = await fetch("/api/analyze", {
          method: "POST",
          body: formData
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || "Произошла ошибка при обработке.");
        }

        badge.innerText = "✅ 3D Модель успешно построена!";
        specViewer.innerText = JSON.stringify(data.spec, null, 2);

        // Кнопка скачивания STEP
        downloadBtn.href = data.step_url;
        downloadBtn.style.display = "block";

        // Отображение STL модели
        loadSTLModel(data.stl_url);

      } catch (err) {
        badge.innerText = "❌ Ошибка: " + err.message;
        specViewer.innerText = "// Ошибка выполнения:\n" + err.message;
      } finally {
        processBtn.disabled = false;
      }
    }

    function loadSTLModel(url) {
      const loader = new THREE.STLLoader();
      loader.load(url, function (geometry) {
        if (activeMesh) scene.remove(activeMesh);

        geometry.center();

        const material = new THREE.MeshStandardMaterial({
          color: 0x94a3b8,
          metalness: 0.8,
          roughness: 0.2
        });

        activeMesh = new THREE.Mesh(geometry, material);
        scene.add(activeMesh);
      });
    }

    init3D();
  </script>
</body>
</html>
