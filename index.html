<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Precision AI CAD Engine - Токарная и ЧПУ обработка</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/STLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: #151b2c;
      --accent: #00f2fe;
      --accent-hover: #4facfe;
      --text: #e2e8f0;
      --border: #232d45;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    /* Сайдбар управления */
    .sidebar { width: 420px; background: var(--panel); border-right: 1px solid var(--border); padding: 24px; display: flex; flex-direction: column; gap: 20px; z-index: 10; }
    .logo { font-size: 20px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 10px; }
    .logo span { color: var(--accent); }
    
    .upload-box { border: 2px dashed var(--border); border-radius: 12px; padding: 30px 20px; text-align: center; cursor: pointer; transition: 0.3s; }
    .upload-box:hover { border-color: var(--accent); background: rgba(0, 242, 254, 0.03); }
    .upload-box input { display: none; }
    
    .btn { background: linear-gradient(135deg, var(--accent), var(--accent-hover)); border: none; color: #000; font-weight: 700; padding: 14px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 15px; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    
    .btn-download { background: #22c55e; color: #fff; text-decoration: none; text-align: center; display: none; padding: 14px; border-radius: 8px; font-weight: 700; }
    
    .spec-panel { background: rgba(0,0,0,0.3); border: 1px solid var(--border); border-radius: 8px; padding: 15px; flex-grow: 1; overflow-y: auto; font-family: monospace; font-size: 13px; line-height: 1.5; color: #a0aec0; }

    /* Окно 3D Просмотра */
    .viewport { flex-grow: 1; position: relative; background: radial-gradient(circle at center, #1a233a 0%, #0b0f19 100%); }
    #canvas-container { width: 100%; height: 100%; }
    
    .status-overlay { position: absolute; top: 20px; left: 20px; background: rgba(21, 27, 44, 0.8); backdrop-filter: blur(10px); border: 1px solid var(--border); padding: 12px 20px; border-radius: 30px; font-size: 14px; font-weight: 600; color: var(--accent); }
  </style>
</head>
<body>

  <div class="sidebar">
    <div class="logo">📐 Precision <span>AI CAD</span></div>
    
    <div class="upload-box" onclick="document.getElementById('file-input').click()">
      <div id="upload-text">📁 Перетащите чертеж или нажмите для выбора (JPG, PNG, PDF)</div>
      <input type="file" id="file-input" accept="image/*" onchange="handleFile(this.files[0])">
    </div>

    <button id="process-btn" class="btn" disabled onclick="processDrawing()">Сгенерировать STEP модель</button>
    
    <a id="download-btn" class="btn-download" href="#" download>📥 Скачать STEP модель (.step)</a>

    <div class="spec-panel" id="spec-output">
      // Спецификация распознанных размеров отобразится здесь...
    </div>
  </div>

  <div class="viewport">
    <div class="status-overlay" id="status">Готов к загрузке чертежа</div>
    <div id="canvas-container"></div>
  </div>

  <script>
    let selectedFile = null;
    let scene, camera, renderer, controls, currentMesh;

    // Инициализация Three.js 3D Viewport
    function init3D() {
      const container = document.getElementById('canvas-container');
      scene = new THREE.Scene();
      
      camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
      camera.position.set(100, 100, 150);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(container.clientWidth, container.clientHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Освещение
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xffffff, 0.8);
      dirLight1.position.set(1, 1, 1);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0x00f2fe, 0.5);
      dirLight2.position.set(-1, -1, -1);
      scene.add(dirLight2);

      // Сетка
      const grid = new THREE.GridHelper(300, 30, 0x232d45, 0x151b2c);
      grid.position.y = -20;
      scene.add(grid);

      window.addEventListener('resize', onWindowResize);
      animate();
    }

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      const container = document.getElementById('canvas-container');
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    }

    function handleFile(file) {
      if (!file) return;
      selectedFile = file;
      document.getElementById('upload-text').innerText = `📄 Выбран: ${file.name}`;
      document.getElementById('process-btn').disabled = false;
    }

    async function processDrawing() {
      if (!selectedFile) return;

      const status = document.getElementById('status');
      const specBox = document.getElementById('spec-output');
      const downloadBtn = document.getElementById('download-btn');
      
      status.innerText = "⏳ ИИ распознает чертеж и строит CAD модель...";
      downloadBtn.style.display = "none";

      const formData = new FormData();
      formData.append("file", selectedFile);

      try {
        const response = await fetch("/api/analyze", { method: "POST", body: formData });
        const data = await response.json();

        if (!response.ok) throw new Error(data.detail || "Ошибка обработки");

        status.innerText = "✅ 3D Модель успешно построена!";
        specBox.innerText = JSON.stringify(data.spec, null, 2);

        // Настройка кнопки скачивания STEP
        downloadBtn.href = data.step_url;
        downloadBtn.style.display = "block";

        // Загрузка STL для отображения в Three.js
        loadSTL(data.stl_url);

      } catch (err) {
        status.innerText = "❌ Ошибка: " + err.message;
      }
    }

    function loadSTL(url) {
      const loader = new THREE.STLLoader();
      loader.load(url, function (geometry) {
        if (currentMesh) scene.remove(currentMesh);

        const material = new THREE.MeshStandardMaterial({
          color: 0x90a4ae,
          roughness: 0.3,
          metalness: 0.8
        });

        currentMesh = new THREE.Mesh(geometry, material);
        geometry.center();
        scene.add(currentMesh);
      });
    }

    init3D();
  </script>
</body>
</html>
